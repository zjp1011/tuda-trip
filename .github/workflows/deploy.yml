name: 途搭构建与发布

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_release:
        description: 留空发布 main，或填写要恢复的完整小写提交哈希
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: 测试与构建
    if: github.event_name != 'workflow_dispatch' || inputs.rollback_release == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 安装并审计生产依赖
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: 运行生产构建
        run: npm run build
      - name: 打包并验证发布产物与内测流程
        shell: bash
        run: bash ops/package-release.sh "$RUNNER_TEMP/tuda-trip.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tuda-trip-${{ github.sha }}
          path: ${{ runner.temp }}/tuda-trip.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  release:
    name: 发布与公网检查
    needs: verify
    if: >-
      ${{ !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'))
      && (needs.verify.result == 'success'
          || (github.event_name == 'workflow_dispatch' && inputs.rollback_release != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: tuda-trip-production
      cancel-in-progress: false
    steps:
      - name: 核对发布版本
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
        run: |
          if [[ -n "$ROLLBACK_RELEASE" ]]; then
            if [[ ! "$ROLLBACK_RELEASE" =~ ^[0-9a-f]{40}$ ]]; then
              echo '::error::请输入完整的小写提交哈希。'
              exit 1
            fi
            printf 'operation=rollback\nrelease=%s\n' "$ROLLBACK_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$latest_commit" != "$GITHUB_SHA" ]]; then
            echo 'main 已更新，本次构建的版本无需发布。' >> "$GITHUB_STEP_SUMMARY"
            echo 'operation=skip' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'operation=deploy\nrelease=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.request.outputs.operation == 'deploy'
        with:
          name: tuda-trip-${{ github.sha }}
          path: ${{ runner.temp }}/tuda-release

      - name: 通过专用 SSH 账号发布并验证
        if: steps.request.outputs.operation != 'skip'
        shell: bash
        env:
          OPERATION: ${{ steps.request.outputs.operation }}
          RELEASE: ${{ steps.request.outputs.release }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo '::error::请配置 DEPLOY_SSH_KEY 和 DEPLOY_KNOWN_HOSTS。'
            exit 1
          fi

          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/tuda-ssh.XXXXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$ssh_dir/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh_flags=(
            -T -F /dev/null -i "$ssh_dir/id"
            -o BatchMode=yes -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes -o IdentityAgent=none -o IdentitiesOnly=yes
            -o GlobalKnownHostsFile=/dev/null -o "UserKnownHostsFile=$ssh_dir/known_hosts"
            -o HostKeyAlgorithms=ssh-ed25519
          )
          target=tuda-deploy@trip.yayapeng.xyz

          active_release() {
            local response
            response=$(ssh "${ssh_flags[@]}" "$target" status < /dev/null) || return 1
            [[ "$response" =~ ^ACTIVE\ (none|[0-9a-f]{40})$ ]] || return 1
            printf '%s\n' "${response#ACTIVE }"
          }

          verify_public() {
            local status
            local options=(--disable --silent --show-error --fail --connect-timeout 8
              --max-time 15 --retry 3 --retry-all-errors --retry-max-time 55
              --max-filesize 262144 -H 'Cache-Control: no-cache' -w '%{response_code}')
            status=$(curl "${options[@]}" -o "$ssh_dir/health" "https://trip.yayapeng.xyz/api/health") || return 1
            [[ "$status" == 200 ]] || return 1
            jq -e --arg release "$RELEASE" \
              '.ok == true and .commit == $release and .generationMode == "byok"' "$ssh_dir/health" > /dev/null || return 1
            status=$(curl "${options[@]}" -o "$ssh_dir/home" "https://trip.yayapeng.xyz/") || return 1
            [[ "$status" == 200 && -s "$ssh_dir/home" ]]
          }

          previous=$(active_release) || {
            echo '::error::无法确认途搭当前版本，已停止发布。'
            exit 1
          }
          if [[ "$OPERATION" == deploy ]]; then
            ssh "${ssh_flags[@]}" "$target" "deploy $RELEASE" < "$RUNNER_TEMP/tuda-release/tuda-trip.tar.gz"
          else
            ssh "${ssh_flags[@]}" "$target" "rollback $RELEASE" < /dev/null
          fi

          if verify_public; then
            echo "途搭公网验证通过，生成使用用户自己的 Key。版本 $RELEASE。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo '::error::途搭公网验证失败。'
          if [[ "$previous" == "$RELEASE" ]]; then
            echo '服务器仍在运行发布前的版本。' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$previous" == none ]]; then
            echo '首个版本的本机验证已通过。请核对公网入口和自带 Key 模式后重试。' >> "$GITHUB_STEP_SUMMARY"
          elif current=$(active_release) && [[ "$current" == "$RELEASE" ]] &&
            ssh "${ssh_flags[@]}" "$target" "rollback $previous" < /dev/null; then
            echo "途搭已恢复到发布前的版本 $previous。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::无法确认恢复结果，请检查服务器活动版本。'
          fi
          exit 1
